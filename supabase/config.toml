project_id = "base-crm"

[api]
enabled = true
port = 57321
schemas = ["base_crm_api"]
extra_search_path = ["extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 57322
shadow_port = 57320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 57329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 57323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 57324

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
email_optional = false

[edge_runtime]
enabled = false
inspector_port = 57328

[analytics]
enabled = false
port = 57327
backend = "postgres"
